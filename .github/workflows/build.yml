# .github/workflows/build.yml
# Автосборка дистрибутивов при создании Git-тега (например, v1.0.0)
# Артефакты прикрепляются к GitHub Release автоматически.

name: Build Distributables

on:
  push:
    tags:
      - "v*.*.*"    # Срабатывает на теги вида v1.0.0, v1.2.3 и т.д.

permissions:
  contents: write   # Для создания GitHub Release и загрузки артефактов

jobs:
  # ── macOS .app + .dmg ───────────────────────────────────────────
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          brew install ffmpeg create-dmg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          playwright install chromium

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build .dmg
        run: |
          bash scripts/build_dist.sh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SecureBrowserBot-macOS-${{ steps.version.outputs.VERSION }}
          path: dist/*.dmg
          retention-days: 30

  # ── Windows .exe installer ──────────────────────────────────────
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"

      - name: Install ffmpeg via winget
        run: |
          winget install --id Gyan.FFmpeg --silent --accept-package-agreements --accept-source-agreements
        continue-on-error: true  # winget может отсутствовать на некоторых образах

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          playwright install chromium

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build .exe via PyInstaller
        run: |
          pyinstaller installer\windows\SecureBrowserBot.spec --clean --noconfirm

      - name: Build installer via Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/windows/installer.iss
          options: /O"dist"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SecureBrowserBot-Windows-${{ steps.version.outputs.VERSION }}
          path: dist/SecureBrowserBot-Setup-*.exe
          retention-days: 30

  # ── GitHub Release ──────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Download macOS artifact
        uses: actions/download-artifact@v4.6.2
        with:
          pattern: SecureBrowserBot-macOS-*
          path: release-assets/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4.6.2
        with:
          pattern: SecureBrowserBot-Windows-*
          path: release-assets/

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Secure Browser Bot v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Secure Browser Bot v${{ steps.version.outputs.VERSION }}

            ### Установка

            **macOS:**
            1. Скачай `SecureBrowserBot.dmg`
            2. Открой и перетащи `.app` в `/Applications`
            3. Запусти — появится иконка в menu bar
            4. Отправь `/register` своему боту в Telegram

            **Windows:**
            1. Скачай `SecureBrowserBot-Setup-*.exe`
            2. Запусти установщик
            3. Заполни `BOT_TOKEN` при первом запуске
            4. Отправь `/register` своему боту в Telegram

            ### Требования
            - macOS 12+ / Windows 10+
            - Telegram-аккаунт для управления
            - BOT_TOKEN от [@BotFather](https://t.me/BotFather)
          files: release-assets/**/*
          draft: false
          prerelease: false
